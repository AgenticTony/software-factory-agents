# The factory's own project profile. During bootstrap (BUILD-ORDER.md F-01..F-11)
# the repo is built interactively, one work order per session.
name: software-factory

repo:
  path: ~/Developer/Software_Factory_Agents
  default_branch: main
  remote: https://github.com/AgenticTony/software-factory-agents.git
  merge_method: squash
  # Private repo on a free plan: GitHub answers the protection call with
  # its plan-limit 403, so the factory enforces up-to-date itself (F-26
  # AC-1's exception, F-28 step 1). Merge a factory PR only after
  # `factory run` has reported it ready against the current main.
  branch_protection: unavailable

commands:
  # The documented setup is both halves (README "Setup", CI): pip for the
  # package, npm ci for the pinned sandbox runtime (node_modules/.bin/srt)
  # that the suite's sandbox tests resolve inside the repo. The F-28 step-2
  # readiness run caught setup missing npm ci: a cold clone failed 142
  # tests, all "srt not found" (sandbox.py srt_bin is repo-relative).
  setup: pip install -e ".[dev]" && npm ci
  lint: ruff check .
  test: pytest -q

paths:
  risk:
    # Control files: touching these changes how work is chosen or judged.
    # F-51 (I-1): schema/** moved into the package (factory/data/schema)
    # and the risk glob followed the files — a move never de-risks the
    # queue's own schema.
    factory_control: ["factory/data/schema/**", "TASK-CONTRACT.md", "VALIDATOR-SPEC.md", ".factory/**"]
    deploy: [".github/workflows/**"]
  # #53 finding 1: setup's npm ci installs node_modules/.bin/srt; L1's
  # between-phase git clean -fdx keeps only declared setup outputs, so
  # without this the sandbox runtime is gone for the red/green runs.
  # (pip install -e leaves only *.egg-info in-tree, which nothing needs
  # after install.)
  setup_outputs: ["node_modules"]
  protected:
    - ".factory/**"
    - ".github/workflows/**"
    # F-51 (I-1): schema/**, toolkit/** and prompts/** moved into the
    # package as factory/data/**; this glob followed the files so the
    # move never unprotected them (tests/test_f51.py proves the moved
    # paths still match).
    - "factory/data/**"
    - "TASK-CONTRACT.md"
    - "VALIDATOR-SPEC.md"
    - "CLAUDE.md"
    # The code-owners' review contract (2026-10-26): it shapes what every
    # reviewer judges, so a session can't edit it — same class as the
    # spec docs above.
    - "REVIEW.md"
    # F-33: the corpus that judges the sentinels is itself evidence a
    # session must not edit.
    - "corpus/**"
    # F-28 step 1: what judges agents is protected before the dogfood
    # pilot runs sessions on this repo (Principle 5: agents never edit
    # what judges them).
    - "factory/l0.py"
    - "factory/l1.py"
    - "factory/l2.py"
    - "factory/gates.py"
    - "factory/sandbox.py"
    - "factory/session.py"
    - "factory/publish.py"
    - "factory/orchestrator.py"
    - "factory/prompts.py"
    - "factory/trace.py"
    - "prompts/**"
    # F-22: the vetted toolkit is what sessions are GIVEN (index, vendored
    # files, the vet corpus that judges admission) — a session editing its
    # own toolkit is self-modification one level up from the sandbox's
    # deny layer. toolkit.py is the vetter/loader itself (judge class).
    - "toolkit/**"
    - "factory/toolkit.py"
    # PR #50-#62 review (#52 finding 1): the step-1 list above matched the
    # BUILD-ORDER text, and the text missed modules that also judge or
    # gate agents. l0 hands its skip/assertion/credential scans to
    # sentinels; replay is the corpus gate over them; mergeorder is the
    # self-enforced up-to-date check branch_protection: unavailable relies
    # on; contract is the validating loader and acceptance_hash; approve
    # and tick are the human gates; state is the transition table; prbody
    # builds the PR evidence a human merges on.
    - "factory/sentinels.py"
    - "factory/replay.py"
    - "factory/mergeorder.py"
    - "factory/contract.py"
    - "factory/approve.py"
    - "factory/tick.py"
    - "factory/state.py"
    - "factory/prbody.py"
    # #52 finding 2 / #56 finding 3: a conftest.py (existing or new, any
    # depth) can deselect or skip the protected contract tests without
    # touching a test file or adding a skip marker, and these config
    # files override pyproject's pytest/ruff settings when created.
    # (fnmatch's * crosses "/", so **/conftest.py covers every depth;
    # the bare entry covers the repo root.)
    - "conftest.py"
    - "**/conftest.py"
    - "pytest.ini"
    - "tox.ini"
    - "setup.cfg"
    - "ruff.toml"
    - ".ruff.toml"
    # The profile invariants above, pinned by test.
    - "tests/test_profile_review.py"
    # Existing contract tests, enumerated file by file and NOT as a
    # tests/test_f*.py glob: the session hook denies file creation too,
    # and the dogfood implementers must write tests/test_f11.py and
    # tests/test_f12.py red-first. A task's own contract tests are
    # protected separately, locked at approval (factory/gates.py
    # contract_test_files). tests/test_f28.py lands with this change.
    - "tests/test_f01.py"
    - "tests/test_f02.py"
    - "tests/test_f03.py"
    - "tests/test_f04.py"
    - "tests/test_f05.py"
    - "tests/test_f06.py"
    - "tests/test_f07.py"
    - "tests/test_f08.py"
    - "tests/test_f09.py"
    - "tests/test_f10.py"
    # #52 finding 3: merged by #58/#59 and #61/#63 after the list froze.
    # tests/test_profile_review.py fails when a done task's contract test
    # is missing here: the (human-reviewed) PR that marks a task done adds
    # its file in the same change.
    - "tests/test_f11.py"
    - "tests/test_f12.py"
    - "tests/test_f23.py"
    - "tests/test_f24.py"
    - "tests/test_f25.py"
    - "tests/test_f26.py"
    - "tests/test_f27.py"
    - "tests/test_f28.py"
    - "tests/test_f29.py"
    - "tests/test_f30.py"
    - "tests/test_f33.py"
    # F-22: merges while the task is still draft (closes via
    # BOOTSTRAP.md + reconcile, like the F-11/F-12 precedent above).
    - "tests/test_f22.py"
    # F-38: its contract tests land with the work order itself (the
    # test_f28 precedent) — this PR is the owner-reviewed interactive
    # build, so the file is protected from the day it exists.
    - "tests/test_f38.py"
    # F-41: same precedent — the final-review contract tests land with
    # the work order, protected from the day they exist.
    - "tests/test_f41.py"
    # F-42: same precedent — the session-hardening contract tests, plus
    # the attribution pattern list itself (it judges commit messages and
    # PR text; a session weakening it edits what judges it).
    - "tests/test_f42.py"
    - "factory/attribution.py"
    # F-31's closing invariant, restored here: PR #86 shipped the
    # dashboard's contract tests but not its protected entry, and the
    # queue state this change carries (F-31 reconciled to done) trips
    # tests/test_profile_review until the file is listed — the done task's
    # tests must be protected from the day the task is done.
    - "tests/test_f31.py"
    # F-16: same invariant — #91 ticked F-16 done without listing its
    # contract test, and test_done_tasks_contract_tests_are_protected
    # failed every gate on main until this entry landed.
    - "tests/test_f16.py"
    # F-43: same precedent — the egress-seam contract tests land with the
    # work order (the test_f28/F-42 line); its AC-6 tripwire judges every
    # channel session text can leave through, so it is protected from the
    # day it exists.
    - "tests/test_f43.py"
    # F-44: same precedent — the verdict-integrity contract tests land
    # with the work order. They judge the canonical-severity, conflicting-
    # verdict, final-summary and pytest.raises rules the protected
    # l0/l2/sentinels modules enforce, so they are protected from the day
    # they exist.
    - "tests/test_f44.py"
    # F-45: same precedent — the pre-lease/publish/crash-window contract
    # tests land with the work order (the test_f43/F-44 line). They judge
    # the lease invariant, the best-effort log seam, the one timed
    # remote-call wrapper, finish()'s attempt atomicity, the gh JSON
    # guards, the dir-fsync and the holder-liveness rules the protected
    # orchestrator/state/publish/mergeorder modules enforce.
    - "tests/test_f45.py"
    # F-46: same precedent — the gate-evasion contract tests (per-commit
    # attribution scan, canonical-form matching, rename-aware lint
    # suppression, schema-default runner-config protection, L1's
    # not-collected failure) judge the protected l0/l1/sentinels/
    # attribution/contract modules and the schema default itself.
    - "tests/test_f46.py"
    # F-47: same precedent — the sandbox read-boundary contract tests
    # (factory-root deny with real srt, the escapee alarm, the vetted-
    # allowlist admission check, explicit toolkit staging) judge the
    # protected sandbox/session/orchestrator/trace/toolkit modules.
    - "tests/test_f47.py"
    # F-48: same precedent — the eval-parity contract tests (the shared
    # settle_review_verdict chain, quota-before-parse, the per-layer
    # clean line, repeats with spread) judge the protected l2/orchestrator
    # verdict path and the eval that measures it.
    - "tests/test_f48.py"
    # F-49: same precedent — the contract/importer-hardening contract
    # tests (the queue-wide AST ref guard, the live format checker, the
    # announced truncation, the locked fresh-queue race) judge the
    # protected contract/state modules and the queue's own integrity.
    - "tests/test_f49.py"
    # F-56: same precedent — the session-record-transport contract tests
    # (file transport proven with real srt on both platforms, the
    # self-explaining record failure, bounded permission_denials, the
    # srt-kill reporting, the importer salvage) judge the protected
    # session/sandbox/egress modules and the record channel every seat's
    # result rides on.
    - "tests/test_f56.py"
    # F-51: same precedent — the suite/CI-hygiene contract tests (the
    # interpreter-independent prompt check, the live-network job split,
    # the explicit live opt-in, exact tool pins, warnings-as-errors,
    # condition waits, the shared tests/_support package, the wheel
    # install, pyright) judge the gate every other WO is judged by.
    - "tests/test_f51.py"
    # F-57: same precedent — the importer-robustness contract tests (the
    # propose_task tool's per-task validation and bounds, the ONE repair
    # session, the prose fixture's offline proof, the importer eval's
    # live gate) judge the import path every queue is born from. The
    # prose fixture itself is the evidence those tests and the owner's
    # paid eval run against — protected with them.
    - "tests/test_f57.py"
    - "tests/fixtures/**"
    # F-58: same precedent — the host-preflight/red-CI-guard contract
    # tests (the preflight's refusal battery, gh_ci_state's
    # classification, the sweep's CI gate, the host table, the
    # token-literal lint) judge the protected sandbox/mergeorder/
    # orchestrator modules and the GitGuardian hygiene of every later
    # test file, so they are protected from the day they exist.
    - "tests/test_f58.py"
    # F-62: the host-boundary contract tests (the trusted srt launcher,
    # the push-content secret fence, the project-slug rule) judge the
    # protected sandbox/publish/runs/trace/contract modules — the same
    # precedent, protected from the day they exist.
    - "tests/test_f62.py"
    # F-63: the owner-approval contract tests (the task/profile ledger,
    # exact-host egress entries, structural .factory protection) judge
    # the protected approvals/contract/state/orchestrator/approve
    # modules and the ledger schema itself — same precedent.
    - "tests/test_f63.py"
    # F-64: the parent-side budget-accounting contract tests (fixed
    # per-seat turn caps, the review wall reserve, bounded free quota
    # requeues, budget visibility/schema maxima) judge the protected
    # orchestrator/state/approve/schema modules — same precedent,
    # protected from the day they exist.
    - "tests/test_f64.py"
    # F-65: the declared-file-scope contract tests (scope patterns in
    # the schema/semantics/hash, the L0 out_of_scope gate, the
    # request_scope transport and escalation, the generated-file
    # profile group) judge the protected gates/l0/state/approve/
    # session/schema modules — same precedent, protected from the day
    # they exist.
    - "tests/test_f65.py"
    # The reconcile guards: the repo ledger must reconcile cleanly (named
    # owner-pending entries aside) and every task section must parse —
    # the judge of the ledger grammar, protected like the contract tests.
    - "tests/test_reconcile_ledger.py"
    # F-63: the approval ledger module is judge surface (it decides what
    # the owner approved — the factory/attribution.py and factory/egress.py
    # precedent: a session must not edit what gates it).
    - "factory/approvals.py"
    # F-59: the ONE resolver is the same class (it decides whose provider
    # token reaches which endpoint — every seat's provider, credential
    # and egress host resolves through it), and the per-project-provider
    # contract tests judge it and the protected session/sandbox/
    # orchestrator/importer wiring — same precedent, protected from the
    # day they exist.
    - "factory/provider.py"
    - "tests/test_f59.py"
    # F-43 review round 1: the seam itself and its vent wiring, the F-42
    # factory/attribution.py precedent — a factory-built PR must not be
    # able to weaken the C-1 fix (scrub_session_text returning its input,
    # clean_text dropping its secrets) without the protected-path check
    # forcing a human review.
    - "factory/egress.py"
    - "factory/vent.py"
    # F-67: the importer-v0-gates contract tests (gate normalisation, the
    # import session records, possibly-shipped flags, dropped-criteria
    # accounting) judge the protected importer/approve/session/status/
    # schema modules — same precedent, protected from the day they exist.
    - "tests/test_f67.py"
    # F-71: the pre-spend-check contract tests (scope risk coverage,
    # runnable refs, the budget floor, the dependency policy) judge the
    # protected approve/importer/l0/gates/contract/approvals modules and
    # the two new dependency judge modules below — same precedent.
    - "tests/test_f71.py"
    # F-72: the escalation-recovery contract tests (guarded retries that
    # keep no trace in published history, the arbiter seat, the escalation
    # draft PR, the SHA-keyed accept waiver, the parking loop) judge the
    # protected orchestrator/state/approve/publish/provider/session/
    # approvals modules and the schemas — same precedent, protected from
    # the day they exist.
    - "tests/test_f72.py"
    - "tests/_support/f72.py"
    # F-75: same precedent — the CI-is-part-of-done contract tests
    # (the publish-path wait, the flake re-run, the same-PR fix round,
    # the leased fast-forward update, ci_failed, the every-repo ready
    # rule) judge the protected orchestrator/ci/publish/mergeorder/
    # config modules and the schema — protected from the day they exist.
    - "tests/test_f75.py"
    - "tests/_support/f75.py"
    # F-71: the dependency policy is judge surface — deps.py decides
    # what a manifest change means, registry.py decides whether a
    # package may be installed, and the generator writes the near-miss
    # lists the registry check reads. A session weakening any of them
    # edits what judges it.
    - "factory/deps.py"
    - "factory/registry.py"
    - "scripts/generate_top_packages.py"
    # Per-task: the orchestrator adds each task's acceptance-test files once the
    # contract is approved, so workers cannot weaken the tests that define "done".

dependency_manifests:
  - pyproject.toml

deploy:
  mechanism: none (local CLI; nothing ships)
  auto_on_merge: false

live_checks: {}   # no deployment target in v0; F-14 adds the mechanism

holdouts:
  dir: ~/factory/holdouts/software-factory
  runner: "TODO — define with F-15"

docs_allowlist:
  - docs.python.org
  - docs.pytest.org
  - json-schema.org

# F-11 review round (2026-10-26): the L2 reviewer ran the smell baseline
# only — this repo's own conventions (conventional commits with the WO
# id, branch naming, one-branch-per-work-order) never reached it, and an
# independent review found 6 of 8 findings L2 missed, including a
# convention violation CLAUDE.md states outright. The reviewer reads
# these; the implementer never does (F-09 AC-5: standards live with the
# reviewer, not under context pressure). REVIEW.md is the code-owners'
# review contract (evidence, truthfulness, nit budget) — the pattern
# Anthropic's Claude Code team credits for their review-quality jump
# (claude.dev/blog/solving-code-review-at-anthropic).
standards:
  - CLAUDE.md
  - REVIEW.md

network_allowlist:
  - pypi.org
  - files.pythonhosted.org
  # F-28 step 2: setup's npm ci (the pinned sandbox runtime) runs inside
  # the sandboxed gate runner and fetches from the npm registry.
  - registry.npmjs.org

# F-31 attempt 3 (owner-directed, review decision on #76): this repo's own
# test suite starts real loopback servers (the F-31 dashboard tests bind
# 127.0.0.1), and without the bind every gate run fails them on the
# environment, not the code (3 attempts lost that way). GATE RUNNER ONLY:
# srt's macOS rules also grant outbound connect to every host loopback
# port (DevTools of a logged-in browser, local DBs, dev/MCP servers) —
# reach the implementer/reviewer sessions must never have, so the opt-in
# applies to the gate's settings alone (schema/project.schema.json).
sandbox:
  allow_local_binding: true

cross_repo: []
