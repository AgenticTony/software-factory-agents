name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # Pinned, not ubuntu-latest: from 2026-10-24 that label resolved to
    # ubuntu-26.04, where srt's nested user namespace is capability-
    # restricted (`apply-seccomp: write /proc/self/setgroups ...
    # Permission denied`) and the AppArmor sysctl below does not lift it —
    # every sandbox test failed. 24.04 is the verified sandbox host.
    runs-on: ubuntu-24.04
    strategy:
      # Both interpreters always report in full: with fail-fast on, one
      # job's failure cancels the other mid-run and hides its result.
      fail-fast: false
      matrix:
        # 3.11 = declared floor (requires-python); 3.13 = local dev version
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Sandbox stack (F-05): srt comes from the committed lockfile — the
      # same build as the orchestrator's Mac — and on Linux needs bubblewrap,
      # socat and ripgrep. Ubuntu 24.04 blocks unprivileged user namespaces
      # through AppArmor, which breaks bubblewrap out of the box; lift it so
      # the sandbox acceptance tests run for real here (they are never
      # skipped — a broken sandbox stack must fail CI, not hide from it).
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # TEMPORARY DIAGNOSTIC (fix/ci-xdist-flakes; remove before merge):
      # parallel runs intermittently fail with fork() EAGAIN ("Resource
      # temporarily unavailable") on this runner only. Record the limits
      # and sample task counts while the suite runs, to name the cap hit.
      - name: Start task sampler (diagnostic)
        run: |
          ulimit -a
          echo "threads-max=$(cat /proc/sys/kernel/threads-max) pid_max=$(cat /proc/sys/kernel/pid_max) nproc=$(nproc)"
          cg=$(cut -d: -f3 /proc/self/cgroup)
          echo "cgroup=$cg pids.max=$(cat /sys/fs/cgroup$cg/pids.max 2>/dev/null) memory.max=$(cat /sys/fs/cgroup$cg/memory.max 2>/dev/null)"
          for u in "$cg" $(dirname "$cg"); do echo "$u pids.max=$(cat /sys/fs/cgroup$u/pids.max 2>/dev/null)"; done
          nohup bash -c '
            peak=0
            while sleep 2; do
              mine=$(ps -eLo user= | grep -c "^runner")
              all=$(ps -eL --no-headers | wc -l)
              avail=$(awk "/MemAvailable/{print int(\$2/1024)}" /proc/meminfo)
              echo "$(date +%T) runner_tasks=$mine all_tasks=$all cg_pids=$(cat /sys/fs/cgroup'"$cg"'/pids.current 2>/dev/null) mem_avail_mb=$avail commit_mb=$(awk "/Committed_AS/{print int(\$2/1024)}" /proc/meminfo)"
              if [ "$mine" -gt "$peak" ]; then
                peak=$mine
                ps -eLo user=,comm= | sort | uniq -c | sort -rn | head -25 > /tmp/peak_snapshot.txt
              fi
            done' > /tmp/task_samples.txt 2>&1 &
      - run: pytest -q -n auto
      - name: Task sampler report (diagnostic)
        if: always()
        run: |
          echo "== peak by runner_tasks"; sort -t= -k2 -n /tmp/task_samples.txt | tail -3
          echo "== lowest mem_avail_mb"; sed -n "s/.*mem_avail_mb=\([0-9]*\).*/\1 &/p" /tmp/task_samples.txt | sort -n | head -3
          echo "== overcommit: $(cat /proc/sys/vm/overcommit_memory) $(grep -E "CommitLimit|MemTotal|SwapTotal" /proc/meminfo | tr -s " " | tr "\n" " ")"
          echo "== top 25 at peak"; cat /tmp/peak_snapshot.txt
          echo "== last samples"; tail -5 /tmp/task_samples.txt
