name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # Pinned, not ubuntu-latest: from 2026-10-24 that label resolved to
    # ubuntu-26.04, where srt's nested user namespace is capability-
    # restricted (`apply-seccomp: write /proc/self/setgroups ...
    # Permission denied`) and the AppArmor sysctl below does not lift it —
    # every sandbox test failed. 24.04 is the verified sandbox host.
    runs-on: ubuntu-24.04
    strategy:
      # Both interpreters always report in full: with fail-fast on, one
      # job's failure cancels the other mid-run and hides its result.
      fail-fast: false
      matrix:
        # 3.11 = declared floor (requires-python); 3.13 = local dev version
        python-version: ["3.11", "3.13"]
    steps:
      # Full history, not the default depth-1 shallow checkout: create_run
      # makes `git clone --filter=blob:none` partial clones of this repo, and
      # a partial clone of a SHALLOW source recurses through lazy fetches
      # without bound (fetch -> upload-pack -> fetch ...) - ~17k tasks, the
      # runner cgroup's pids.max, then fork() EAGAIN across the suite.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # F-51 (m-22): the alias `22` resolves to the NEWEST 22.x release,
      # and srt's engines floor (>=22.12.0, package-lock.json) is a 22.x
      # version — so the alias can never resolve below the floor while
      # staying inside the major the floor lives in.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Sandbox stack (F-05): srt comes from the committed lockfile — the
      # same build as the orchestrator's Mac — and on Linux needs bubblewrap,
      # socat and ripgrep. Ubuntu 24.04 blocks unprivileged user namespaces
      # through AppArmor, which breaks bubblewrap out of the box; lift it so
      # the sandbox acceptance tests run for real here (they are never
      # skipped — a broken sandbox stack must fail CI, not hide from it).
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # F-51 (m-20): the main job deselects EXACTLY live_network — every
      # sandbox-deny assertion that does not need the public internet stays
      # mandatory here; only the internet-dependent tests move to the
      # live-network job (an endpoint outage reddens that named job, not
      # every PR).
      - run: pytest -q -n auto -m "not live_network"

  live-network:
    # F-51 (m-20): the tests that need the PUBLIC INTERNET (api.z.ai
    # reachability; the raw-socket deny to a public IP, where "denied"
    # can only be told apart from "offline" on a live network). Selecting
    # zero tests fails this job (pytest exit 5 on no tests collected), so
    # a marker rename can never silently deselect the live coverage.
    # One interpreter: the network boundary is the sandbox's, not the
    # interpreter's — the main job's matrix already covers both.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q -rs -m live_network

  typecheck:
    # F-51 (A-7): pyright basic over the factory package, exactly pinned
    # in the dev extra. Its own job: no sandbox stack needed, and a
    # type error must fail a NAMED job, not hide inside a matrix leg.
    # --warnings: a warning-only run must fail too (round 1, finding 4a
    # — bare pyright exits 0 on warnings, which would neuter the check).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pyright --warnings

  wheel:
    # F-51 (I-1): the package works as a WHEEL, not only from this
    # checkout. Build it, install it into a fresh venv, then run from
    # OUTSIDE the checkout (so the source tree cannot shadow the
    # install) a load of the real contract + toolkit index + prompts
    # through the installed package. tests/test_f51.py EXECUTES these
    # exact run steps (path-substituted to a temp dir) so the shipped
    # job is what is proven, not a parallel reimplementation.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The exact dev-extra pins (m-22): --no-isolation builds with the
      # RUNNING env's tools, so they must be installed here — and Python
      # 3.12+ venvs bundle no setuptools at all (round 1, finding 2a).
      - run: python -m pip install "build==1.6.1" "setuptools==84.2.1"
      - run: python -m build --wheel --no-isolation
      - run: python -m venv /tmp/wheelenv && /tmp/wheelenv/bin/pip install dist/*.whl
      # From $HOME (outside the checkout): the import must resolve to the
      # installed wheel, and the resources must come from the package —
      # the fresh venv's python, never the runner's (only the wheel is
      # installed there). The workspace path comes from the environment
      # (a quoted heredoc never expands $GITHUB_WORKSPACE — round 1,
      # finding 2b).
      - run: |
          cd "$HOME"
          /tmp/wheelenv/bin/python - <<'EOF'
          import os
          import pathlib
          import factory.contract as contract
          import factory.prompts as prompts
          import factory.toolkit as toolkit

          repo = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          tasks = contract.load_tasks(repo / ".factory" / "tasks.json")
          profile = contract.load_profile(repo / ".factory" / "project.yaml")
          assert tasks and profile, "contract load through the wheel failed"
          index = toolkit.load_index(toolkit.default_toolkit_dir())
          assert index.get("items") is not None, "toolkit index missing"
          assert prompts.load_prompt(prompts.REVIEWER_FILE)
          location = str(pathlib.Path(contract.__file__))
          assert "site-packages" in location, (
              f"factory imported from {location} — the checkout is shadowing the wheel"
          )
          print("wheel ok:", location)
          EOF
