name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # Pinned, not ubuntu-latest: from 2026-10-24 that label resolved to
    # ubuntu-26.04, where srt's nested user namespace is capability-
    # restricted (`apply-seccomp: write /proc/self/setgroups ...
    # Permission denied`) and the AppArmor sysctl below does not lift it —
    # every sandbox test failed. 24.04 is the verified sandbox host.
    runs-on: ubuntu-24.04
    strategy:
      # Both interpreters always report in full: with fail-fast on, one
      # job's failure cancels the other mid-run and hides its result.
      fail-fast: false
      matrix:
        # 3.11 = declared floor (requires-python); 3.13 = local dev version
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Sandbox stack (F-05): srt comes from the committed lockfile — the
      # same build as the orchestrator's Mac — and on Linux needs bubblewrap,
      # socat and ripgrep. Ubuntu 24.04 blocks unprivileged user namespaces
      # through AppArmor, which breaks bubblewrap out of the box; lift it so
      # the sandbox acceptance tests run for real here (they are never
      # skipped — a broken sandbox stack must fail CI, not hide from it).
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # TEMPORARY DIAGNOSTIC (fix/ci-xdist-flakes; remove before merge):
      # parallel runs intermittently fail with fork() EAGAIN ("Resource
      # temporarily unavailable") on this runner only. Record the limits
      # and sample task counts while the suite runs, to name the cap hit.
      - name: Start task sampler (diagnostic)
        run: |
          ulimit -a
          echo "threads-max=$(cat /proc/sys/kernel/threads-max) pid_max=$(cat /proc/sys/kernel/pid_max) nproc=$(nproc)"
          cg=$(cut -d: -f3 /proc/self/cgroup)
          echo "cgroup=$cg pids.max=$(cat /sys/fs/cgroup$cg/pids.max 2>/dev/null) memory.max=$(cat /sys/fs/cgroup$cg/memory.max 2>/dev/null)"
          # One process walks /proc (ps forks per call and fails at the cap).
          cat > /tmp/snap.py <<'EOF'
          import collections, os, sys
          procs = {}
          for d in os.listdir("/proc"):
              if not d.isdigit():
                  continue
              try:
                  st = open(f"/proc/{d}/status").read()
                  f = dict(l.split(":", 1) for l in st.splitlines() if ":" in l)
                  cmd = open(f"/proc/{d}/cmdline", "rb").read().replace(b"\0", b" ").decode(errors="replace")
              except OSError:
                  continue
              procs[int(d)] = (int(f["PPid"]), int(f["Threads"]), f["Name"].strip(), f["State"].strip()[:1], cmd[:240])
          print(f"== snapshot {sys.argv[1]}: procs={len(procs)} threads={sum(p[1] for p in procs.values())}")
          print("-- top 12 by threads (pid ppid threads state name | cmd)")
          for pid, p in sorted(procs.items(), key=lambda kv: -kv[1][1])[:12]:
              print(pid, p[0], p[1], p[3], p[2], "|", p[4])
          print("-- top 12 by process count per (name, state, parent cmd)")
          groups = collections.Counter((p[2], p[3], procs.get(p[0], (0, 0, "?", "?", "?"))[4][:160]) for p in procs.values())
          for (name, state, parent), n in groups.most_common(12):
              print(n, name, state, "| parent:", parent)
          EOF
          nohup bash -c '
            next=1500
            while sleep 1; do
              n=$(cat /sys/fs/cgroup'"$cg"'/pids.current 2>/dev/null)
              avail=$(awk "/MemAvailable/{print int(\$2/1024)}" /proc/meminfo)
              echo "$(date +%T) cg_pids=$n mem_avail_mb=$avail"
              if [ "$n" -ge "$next" ]; then
                python3 /tmp/snap.py "cg_pids=$n at $(date +%T)" >> /tmp/snapshots.txt 2>&1
                next=$((next * 2))
              fi
            done' > /tmp/task_samples.txt 2>&1 &
      - run: pytest -q -n auto
      - name: Task sampler report (diagnostic)
        if: always()
        run: |
          echo "== peak cg_pids"; sort -t= -k2 -n /tmp/task_samples.txt | tail -3
          cat /tmp/snapshots.txt
          echo "== last samples"; tail -3 /tmp/task_samples.txt
