[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "software-factory"
version = "0.1.0"
description = "Local agent software factory control plane"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4",
    "PyYAML>=6",
    # Exact pin (BUILD-ORDER stack line). The runner is written against the
    # 0.2.x ResultMessage shape — model_usage, terminal_reason,
    # api_error_status — which 0.1.x drops entirely. A drift here must be a
    # red CI run, not a silent behaviour change.
    "claude-agent-sdk==0.2.168",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
factory = "factory.cli:main"

[tool.setuptools.packages.find]
include = ["factory*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
