[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "software-factory"
version = "0.1.0"
description = "Local agent software factory control plane"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4",
    # F-49 AC-2 (m-3): jsonschema's `format: date-time` check is silently
    # a no-op without this optional dependency — the factory's schema
    # validator passes a FormatChecker, so malformed timestamps must
    # actually be refused (tests/test_f49.py fails if it goes missing).
    # Exact pin: PyPI has only 0.1.x, and F-51's direction is exact pins
    # (review round 1, finding 1 — ">=2" matched nothing and CI's
    # `pip install -e ".[dev]"` failed before any test ran).
    "rfc3339-validator==0.1.4",
    "PyYAML>=6",
    # Exact pin (BUILD-ORDER stack line). The runner is written against the
    # 0.2.x ResultMessage shape — model_usage, terminal_reason,
    # api_error_status — which 0.1.x drops entirely. A drift here must be a
    # red CI run, not a silent behaviour change.
    "claude-agent-sdk==0.2.168",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-xdist==3.8.0",
    "ruff>=0.6",
]

[project.scripts]
factory = "factory.cli:main"

[tool.setuptools.packages.find]
include = ["factory*"]

# F-31: the dashboard's static assets ship in the package.
[tool.setuptools.package-data]
"factory" = ["dashboard_static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
